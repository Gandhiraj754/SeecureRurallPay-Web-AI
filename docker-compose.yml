version: '3.8'

services:
  # ── Frontend (Nginx) ─────────────────────────────────────────
  frontend:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - srp_net

  # ── Backend (Flask) ─────────────────────────────────────────
  backend:
    build: .
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-in-production}
      - JWT_SECRET=${JWT_SECRET:-change-jwt-secret-in-production}
      - DATABASE_URL=${DATABASE_URL:-postgresql://srp:srp@postgres:5432/secureruralpay}
      - MONGO_URI=${MONGO_URI:-mongodb://mongo:27017/srp_fraud_logs}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - ./backend/models:/app/backend/models:ro
      - pdf_uploads:/tmp/srp_uploads
    depends_on:
      - postgres
      - redis
      - mongo
    restart: unless-stopped
    networks:
      - srp_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── PostgreSQL (Main DB) ──────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=secureruralpay
      - POSTGRES_USER=srp
      - POSTGRES_PASSWORD=${DB_PASSWORD:-srp_secure_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped
    networks:
      - srp_net

  # ── MongoDB (Fraud Logs) ──────────────────────────────────────
  mongo:
    image: mongo:7-jammy
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped
    networks:
      - srp_net

  # ── Redis (OTP Cache + Rate Limiting) ───────────────────────
  redis:
    image: redis:7-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD:-srp_redis_pass}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - srp_net

  # ── Celery Worker (Async Tasks + ML Retrain) ─────────────────
  celery:
    build: .
    command: celery -A backend.celery_app worker --loglevel=info --concurrency=2
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    volumes:
      - ./backend/models:/app/backend/models
    depends_on:
      - redis
      - backend
    restart: unless-stopped
    networks:
      - srp_net

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  pdf_uploads:

networks:
  srp_net:
    driver: bridge
